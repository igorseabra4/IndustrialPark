name: Build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore IndustrialPark.sln
      - name: Build
        run: dotnet build IndustrialPark.sln --configuration Release --no-restore -m:1
      - name: Run tests
        shell: pwsh
        run: |
          & .\IndustrialParkTest\bin\Release\net10.0-windows\IndustrialParkTest.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
